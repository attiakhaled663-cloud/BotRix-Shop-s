<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Botrix Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:400px;
    text-align:center;
}

input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:15px;
    padding:0 20px;
    font-size:18px;
    color:#fff;
    background:linear-gradient(135deg,#2b1400,#4d2600);
    box-shadow:0 0 15px rgba(255,120,0,.35);
}

input::placeholder{
    color:#ffc98b;
}

button{
    margin-top:18px;
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#ff7300,#ff3d00);
    box-shadow:0 0 20px rgba(255,100,0,.5);
    transition:.25s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 30px rgba(255,120,0,.8);
}

button:active{
    transform:scale(.98);
}
</style>

</head>
<body>

<div class="container">

<input
id="channel"
type="text"
placeholder="ادخل الاسم"
autocomplete="off">

<button onclick="goShop()">Go</button>

</div>

<script>
function goShop(){

const name=document.getElementById("channel").value.trim();

if(name===""){
    alert("اكتب اسم القناة");
    return;
}

window.location.href=
"https://botrix.live/k/"+encodeURIComponent(name)+"/shop";

}

document.getElementById("channel").addEventListener("keypress",function(e){
if(e.key==="Enter"){
goShop();
}
});
</script>

</body>
</html>
