<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Botrix Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* خلفية هالوين بسيطة */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,120,0,.08), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(255,80,0,.08), transparent 35%);
    filter:blur(40px);
    pointer-events:none;
}

.container{
    width:90%;
    max-width:400px;
    text-align:center;
}

input{
    width:100%;
    height:58px;
    border:1px solid rgba(255,140,0,.35);
    outline:none;
    border-radius:18px;
    padding:0 20px;
    font-size:18px;
    color:#fff;

    background:
        radial-gradient(circle at top left,#ff8c0040,transparent 45%),
        radial-gradient(circle at bottom right,#ff450030,transparent 45%),
        linear-gradient(135deg,#1c1208,#2b1708,#1a1008);

    box-shadow:
        0 0 18px rgba(255,120,0,.25),
        inset 0 0 15px rgba(255,140,0,.12);

    transition:.3s;
}

input::placeholder{
    color:#ffbf75;
}

input:focus{
    border-color:#ff9d00;
    box-shadow:
        0 0 28px rgba(255,140,0,.55),
        inset 0 0 18px rgba(255,140,0,.2);
}

button{
    margin-top:18px;
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
    color:#fff;

    background:
        radial-gradient(circle at top,#ffb34755,transparent 45%),
        linear-gradient(135deg,#ff8c00,#ff5a00,#c62828);

    box-shadow:
        0 0 22px rgba(255,120,0,.45),
        inset 0 0 15px rgba(255,210,120,.25);

    transition:.25s;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:
        0 0 35px rgba(255,140,0,.8),
        inset 0 0 18px rgba(255,210,120,.3);
}

button:active{
    transform:scale(.98);
}
</style>

</head>

<body>

<div class="container">

<input
id="channel"
type="text"
placeholder="ادخل الاسم"
autocomplete="off">

<button onclick="goShop()">Go</button>

</div>

<script>
function goShop(){

const name=document.getElementById("channel").value.trim();

if(name===""){
    alert("اكتب اسم القناة");
    return;
}

window.location.href="https://botrix.live/k/"+encodeURIComponent(name)+"/shop";

}

document.getElementById("channel").addEventListener("keypress",function(e){
if(e.key==="Enter"){
goShop();
}
});
</script>

</body>
</html>
